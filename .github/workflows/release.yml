name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: cargo build --release --locked -p orbynode-daemon --target ${{ matrix.target }}
      - name: Create SBOM
        shell: bash
        run: |
          mkdir -p dist
          cargo tree --locked --workspace > "dist/orbynode-${{ matrix.target }}-sbom.txt"
      - name: Archive daemon
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "dist/orbynode-${{ matrix.target }}.zip" "target/${{ matrix.target }}/release/orbynode-daemon${{ runner.os == 'Windows' && '.exe' || '' }}"
          else
            tar -czf "dist/orbynode-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "orbynode-daemon${{ runner.os == 'Windows' && '.exe' || '' }}"
          fi
      - name: Checksums
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then sha256sum "orbynode-${{ matrix.target }}.zip" > "orbynode-${{ matrix.target }}.zip.sha256"; else shasum -a 256 "orbynode-${{ matrix.target }}.tar.gz" > "orbynode-${{ matrix.target }}.tar.gz.sha256"; fi
          sha256sum "orbynode-${{ matrix.target }}-sbom.txt" > "orbynode-${{ matrix.target }}-sbom.txt.sha256"
      - name: Sign artifact
        uses: sigstore/cosign-installer@v3
      - name: Cosign sign
        shell: bash
        run: |
          file="dist/orbynode-${{ matrix.target }}.${{ matrix.archive }}"
          cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
      - uses: actions/upload-artifact@v4
        with:
          name: orbynode-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
