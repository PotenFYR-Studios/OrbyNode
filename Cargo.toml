[workspace]
resolver = "2"
members = ["crates/core", "crates/api", "crates/daemon", "crates/terminal", "crates/realtime"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
orbynode-core = { path = "crates/core" }
orbynode-terminal = { path = "crates/terminal" }
orbynode-realtime = { path = "crates/realtime" }
orbynode-api = { path = "crates/api" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
