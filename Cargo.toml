[workspace]
resolver = "2"
members = ["crates/core", "crates/api", "crates/daemon", "crates/terminal", "crates/realtime", "crates/database", "crates/auth", "crates/agents", "crates/integrations", "crates/files", "crates/services", "crates/nodes", "crates/notifications", "crates/workflows"]
exclude = ["desktop/tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
orbynode-core = { path = "crates/core" }
orbynode-terminal = { path = "crates/terminal" }
orbynode-agents = { path = "crates/agents" }
orbynode-files = { path = "crates/files" }
orbynode-integrations = { path = "crates/integrations" }
orbynode-auth = { path = "crates/auth" }
orbynode-database = { path = "crates/database" }
orbynode-realtime = { path = "crates/realtime" }
orbynode-services = { path = "crates/services" }
orbynode-api = { path = "crates/api" }
orbynode-nodes = { path = "crates/nodes" }
orbynode-notifications = { path = "crates/notifications" }
orbynode-workflows = { path = "crates/workflows" }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-util"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
